_target_: deeprootgen.data_model.FormModel
components:
  parameters:
    collapsible: true
    children:
      - id: max-order-slider
        param: max_order
        label: Maximum order
        help: The maximum root order
        class_name: dash.dcc.Slider
        kwargs:
          min: 1
          max: 10
          value: 2
          step: 1
          persistence: true
      - id: root-ratio-biomass-input
        param: root_ratio_biomass
        label: Target fine-root biomass fraction
        help: Optional share of dry root biomass at or below the reporting diameter. Supply adjustable orders and scale bounds in advanced settings.
        class_name: dash_bootstrap_components.Input
        kwargs:
          type: number
          min: 0
          max: 1
          step: 0.01
          persistence: true
      - id: root-ratio-length-input
        param: root_ratio_length
        label: Target fine-root length fraction
        help: Optional share of root length at or below the reporting diameter. Supply adjustable orders and scale bounds in advanced settings.
        class_name: dash_bootstrap_components.Input
        kwargs:
          type: number
          min: 0
          max: 1
          step: 0.01
          persistence: true
      - id: fine-root-threshold-input
        param: threshold_root_diameter_cm
        label: Reporting diameter (cm)
        help: Sum root length and dry biomass in two classes using this diameter as the upper bound of the fine class.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          step: 0.01
          value: 0.25
          persistence: true
      - id: branch-minimum-input
        param: min_branching_diameter_cm
        label: Minimum parent diameter for branching (cm)
        help: Allow a daughter at a site at or above this diameter. Zero disables the minimum.
        class_name: dash_bootstrap_components.Input
        kwargs:
          type: number
          min: 0
          step: 0.001
          value: 0.093
          persistence: true
      - id: outer-primary-root-num-input
        param: primary_root_count
        label: Primary root count
        help: Total number of first-order roots.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 1
          max: 20
          step: 1
          value: 18
          persistence: true
      - id: inner-primary-root-num-input
        param: outer_primary_fraction
        label: Outer placement fraction
        help: Fraction of first-order roots assigned to outer placement.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 1
          step: 0.01
          value: 0.55556
          persistence: true
      - id: min-length-primary-root-input
        param: min_primary_length
        label: Primary root minimum length
        help: The minimum length of each primary root (cm)
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 1
          max: 50
          step: 1
          value: 20
          persistence: true
      - id: max-length-primary-root-input
        param: max_primary_length
        label: Primary root maximum length
        help: The maximum length of each primary root (cm)
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 1
          max: 50
          step: 1
          value: 30
          persistence: true
      - id: base-diameter-root-input
        param: base_diameter
        label: Base root diameter
        help: The base diameter of the first segment of each root (cm)
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0.001
          max: 1
          step: 0.01
          value: 0.11
          persistence: true
      - id: root-apex-input
        param: apex_diameter
        label: Native cylinder sampling endpoint (cm)
        help: Draw native cylinder diameters between this endpoint and the order-adjusted base.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0.01
          max: 1
          step: 0.01
          value: 0.02
          persistence: true
      - id: diameter-reduction-factor-input
        param: diameter_reduction
        label: Diameter reduction
        help: The diameter reduction factor for subsequent root segments.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 1
          step: 0.1
          value: 0.2
          persistence: true
      - id: min-num-secondary-roots-input
        param: daughters_per_parent
        label: Daughters per parent
        help: Requested daughter count on each nonterminal parent before branch-site restrictions.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          step: 1
          value: 2
          persistence: true
      - id: secondary-root-growth-input
        param: daughter_count_order_gain
        label: Daughter-count increase by order
        help: Coefficient for the native per-order increase in requested daughters.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          step: 0.1
          value: 0.2
          persistence: true
      - id: min-length-secondary-root-input
        param: min_lateral_length
        label: Minimum lateral length (cm)
        help: Lower length bound for orders above 1 before order scaling.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 1
          max: 250
          step: 1
          value: 100
          persistence: true
      - id: max-length-secondary-root-input
        param: max_lateral_length
        label: Maximum lateral length (cm)
        help: Upper length bound for orders above 1 before order scaling.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 1
          max: 500
          step: 1
          value: 220
          persistence: true
      - id: segments-per-root-input
        param: segments_per_root
        label: Segments per root
        help: The number of segments per root
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 1
          max: 500
          step: 1
          value: 50
          persistence: true
      - id: root-length-reduction-input
        param: length_reduction
        label: Length reduction
        help: The root length reduction factor
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 1
          step: 0.1
          value: 0.5
          persistence: true
      - id: root-vary-input
        param: root_vary
        label: Root segment variance
        help: Random variation in degrees of subsequent root segments along x, y, and z axes
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 360
          step: 1
          value: 30
          persistence: true
      - id: interbranch-distance-input
        param: interbranch_distance
        label: Interbranch distance
        help: The interbranch distance between roots
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0.001
          max: 0.01
          step: 0.001
          value: 0.0078
          persistence: true
      - id: root-tissue-density-input
        param: root_tissue_density
        label: Root tissue density
        help: The root tissue density (g/cm3)
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0.01
          max: 0.1
          step: 0.01
          value: 0.05
          persistence: true
      - id: gravitropism-input
        param: gravitropism
        label: Gravitropism factor
        help: The gravitropism factor for root development
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 1
          step: 0.01
          value: 0.1
          persistence: true
      - id: enable-soil-input
        param: enable_soil
        label: Enable soil
        help: Enable the soil voxel grid into the simulation.
        class_name: dash_daq.BooleanSwitch.BooleanSwitch 
        handler: boolean_switch
        kwargs: 
          persistence: true
      - id: soil-layer-height-input
        param: soil_layer_height
        label: Soil layer height
        help: The height of each soil layer (cm)
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 100
          step: 10
          value: 10
          persistence: true
      - id: soil-layer-width-input
        param: soil_layer_width
        label: Soil layer width
        help: The width of each soil layer (cm)
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 100
          step: 10
          value: 10
          persistence: true
      - id: soil-n-layers
        param: soil_n_layers
        label: Number soil layers
        help: The number of vertical soil layers
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 20
          step: 1
          value: 1
          persistence: true
      - id: soil-n-cols
        param: soil_n_cols
        label: Number soil columns
        help: The number of horizontal soil layers/columns
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 20
          step: 1
          value: 1
          persistence: true          
      - id: random-seed-input
        param: random_seed
        label: Random seed
        help: The simulation random seed to ensure replicability
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          step: 1
          value: 0
          persistence: true
      - id: max-val-attempts-input
        param: max_val_attempts
        label: Maximum validation attempts
        help: The maximum number of attempts to validate each root (for plausibility) within the root system.
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: number
          min: 0
          max: 1000
          step: 1
          value: 50
          persistence: true
      - id: simulation-tag-input
        param: simulation_tag
        label: Simulation tag
        help: A tag to group together multiple simulations
        class_name: dash_bootstrap_components.Input 
        kwargs:
          type: text
          value: default
          persistence: true
      - id: advanced-settings
        param: advanced_settings
        label: Advanced settings (JSON)
        help: 'Optional features, limits and additional parameters. For a ratio target, add parameters.allocation_controls with length_scale_by_order or diameter_scale_by_order and [minimum, maximum] scale bounds.'
        class_name: dash_bootstrap_components.Textarea
        kwargs:
          rows: 4
          persistence: true
          value: '{}'
  simulation:
    collapsible: true
    children:
      - id: run-sim-button
        label: Run
        help: Run the simulation modelling procedure
        class_name: dash_bootstrap_components.Button 
        kwargs:
          children: Run procedure
          color: primary
          className: me-1
      - id: save-param-button
        label: Save
        help: Save current parameter configuration to file
        class_name: dash_bootstrap_components.Button 
        kwargs:
          children: Save parameters
          color: primary
          className: me-1
      - id: upload-param-file-button
        label: Load  
        help: Load parameter configuration from file
        class_name: dash.dcc.Upload
        handler: file_upload
        kwargs:
          children: Load parameters
      - id: save-runs-button
        label: Download
        help: Download the simulation run table as a csv file
        class_name: dash_bootstrap_components.Button 
        kwargs:
          children: Save simulation runs
          color: primary
          className: me-1
      - id: upload-runs-file-button
        label: Upload  
        help: Upload the simulation run table from a csv file
        class_name: dash.dcc.Upload
        handler: file_upload
        kwargs:
          children: Load simulation runs
      - id: clear-runs-button
        label: Clear
        help: Clear the simulation run table 
        class_name: dash_bootstrap_components.Button 
        kwargs:
          children: Clear simulation runs
          color: primary
          className: me-1
  results:
    children:
      - id: simulation-runs-table
        label: Simulation Runs
        help: A table of simulation runs
        class_name: dash.dash_table.DataTable
        handler: data_table
        kwargs:
          filter_action: native
          sort_action: native
          sort_mode: multi
          column_selectable: false
          row_selectable: false
          page_action: native
          page_current: 0
          page_size: 10
          editable: false
          persistence: true
          style_as_list_view: true
