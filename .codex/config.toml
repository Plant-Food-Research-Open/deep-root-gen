approval_policy = "never"
default_permissions = "fruitcropxl-maintainer"

[permissions.fruitcropxl-maintainer]
description = "FruitCropXL workspace editing with repository skill maintenance."
extends = ":workspace"

[permissions.fruitcropxl-maintainer.filesystem.":workspace_roots"]
".agents" = "write"

[permissions.fruitcropxl-maintainer.network]
# Permit network-backed tools, including user-authorized Claude Code calls.
enabled = true
