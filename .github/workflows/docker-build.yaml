name: Docker Build

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Free disk space for locked application dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          df -h .

      - name: Build Dash and Prefect runtime image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker build --file dockerfiles/python/Dockerfile.local \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" .
          echo "DRG_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Verify schema-4 simulation inside the image
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/examples/design/spatial_construction_synthetic.json,target=/tmp/spatial.json,readonly" \
            "$DRG_IMAGE" sh -ec '
              python -m deeprootgen simulate --config /tmp/spatial.json --outdir /tmp/simulation
              for file in nodes.csv edges.csv branching.json row_alignment.json vine_origin_catalogue.json; do
                test -s "/tmp/simulation/$file"
              done
            '

      - name: Publish and verify the image digest
        env:
          # The package was created with the GHCR_TOKEN personal access token, so the
          # workflow token is refused (permission_denied: write_package) until the
          # package grants this repository write access under "Manage Actions access".
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ secrets.GHCR_TOKEN && github.repository_owner || github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$DRG_IMAGE"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$DRG_IMAGE")"
          test "${digest_ref%@*}" = "${DRG_IMAGE%:*}"
          docker manifest inspect "$digest_ref" > /dev/null
          printf 'Published `%s`\n\nDigest `%s`\n' "$DRG_IMAGE" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
