
name: Tests

on:
  release:
    types:
      - published
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CICD_TESTING_ENV: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: |
          poetry install --with dev,torch --no-interaction

      - name: Test code
        run: |
          source .venv/bin/activate
          pytest -v \
            --run-integration \
            --cov=deeprootgen \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --junitxml=test_results.xml \
            --md-report \
            --md-report-verbose=0 \
            --md-report-flavor=gfm \
            --md-report-output=md_report.md

      - name: Output reports to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f md_report.md ]; then
            echo "<details><summary>Test Report</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat md_report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deeprootgen-test-results
          path: |
            md_report.md
            coverage.json
            coverage.xml
            test_results.xml
          if-no-files-found: warn
          retention-days: 14

  update-coverage-badge:
    name: Update Coverage Badge
    needs: run-tests

    if: >-
      ${{
        needs.run-tests.result == 'success' &&
        (github.event_name == 'release' ||
         github.event_name == 'workflow_dispatch')
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: deeprootgen-test-results

      - name: Update Coverage Badge
        uses: we-cli/coverage-badge-action@main

  comment-test-report:
    name: PR Test Report
    needs: run-tests

    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: deeprootgen-test-results

      - name: Render the report to the PR
        if: hashFiles('md_report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Test Report
          recreate: true
          path: md_report.md
