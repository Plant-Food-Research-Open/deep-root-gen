name: Candidate Container

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified PFR main image under its commit SHA
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Free disk space for locked application dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/.ghcup
          df -h .

      - name: Build the candidate from tracked runtime files
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          context="$(mktemp -d)"
          git archive HEAD .dockerignore dockerfiles/python/Dockerfile.local \
            pyproject.toml poetry.lock README.md deeprootgen app/app.py app/conf \
            app/pages app/flows app/deployments bentoml_configuration.yaml scripts/local |
            tar -x -C "$context"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker build --file "$context/dockerfiles/python/Dockerfile.local" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" "$context"
          echo "DRG_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Exercise simulation, Dash, and fitting inside the image
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/scripts/docker/smoke_candidate.py,target=/tmp/smoke_candidate.py,readonly" \
            --mount "type=bind,source=$PWD/examples/synthetic_minimal.json,target=/tmp/synthetic_minimal.json,readonly" \
            --mount "type=bind,source=$PWD/examples/research/core_comparison_synthetic.csv,target=/tmp/core_comparison_synthetic.csv,readonly" \
            -e PYTHONPATH=/app -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            "$DRG_IMAGE" python /tmp/smoke_candidate.py

      - name: Publish and verify the candidate digest
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish &&
          github.repository == 'Plant-Food-Research-Open/deep-root-gen' &&
          github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$DRG_IMAGE"
          digest_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$DRG_IMAGE" |
            awk -v package="${DRG_IMAGE%:*}" 'index($0, package "@") == 1 {print; exit}')"
          test -n "$digest_ref"
          docker manifest inspect "$digest_ref" > /dev/null
          printf 'Published `%s`\n\nDigest `%s`\n' "$DRG_IMAGE" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
