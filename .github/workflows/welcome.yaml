
name: Welcome New Users

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/welcome@v1.3.1
        with:
          FIRST_ISSUE_REACTIONS: "+1, hooray, rocket, heart"
          FIRST_ISSUE: |
            👋 @{{ author }}

            Welcome to the DeepRootGen community!

            Thank you for opening your first issue. We appreciate
            your interest in helping improve DeepRootGen.

            Please provide any relevant details, including steps to
            reproduce the issue, simulation parameters, and error
            messages where applicable.

          STAR_MESSAGE: |
            🌟 If you find DeepRootGen useful, consider starring
            the repository to support the project!

  welcome-pr-opened:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/welcome@v1.3.1
        with:
          FIRST_PR_REACTIONS: "+1, hooray, rocket, heart"
          FIRST_PR: |
            👋 @{{ author }}

            Welcome to the DeepRootGen community!

            Thank you for submitting your first pull request.
            We appreciate your contribution to the project.

            Please ensure your changes are appropriately documented
            and include relevant tests where applicable.

  welcome-pr-merged:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/welcome@v1.3.1
        with:
          FIRST_PR_MERGED: |
            🎉 @{{ author }}

            Congratulations on your first merged pull request
            to DeepRootGen!

            Thank you for contributing to the development of
            the project. Your contribution is appreciated,
            and we welcome your continued involvement.
