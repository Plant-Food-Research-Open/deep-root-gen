# Flat Load parameters format used by the legacy calibration pages.
# Off/on switches and the target CSV should be checked on the page after load.
max_order: [1, 3]
threshold_root_diameter_cm: [0.05, 0.07]
primary_root_count: [2, 5]
outer_primary_fraction: [0.4, 0.6]
min_primary_length: [18, 21]
max_primary_length: [27, 30]
base_diameter: [0.10, 0.12]
apex_diameter: [0.02, 0.03]
diameter_reduction: [0.15, 0.25]
daughters_per_parent: [1, 3]
daughter_count_order_gain: [0.1, 0.2]
min_lateral_length: [8, 10]
max_lateral_length: [14, 18]
segments_per_root: [4, 6]
length_reduction: [0.4, 0.5]
root_vary: [20, 30]
interbranch_distance: [0.006, 0.009]
root_tissue_density: [0.04, 0.06]
gravitropism: [0.08, 0.12]
random_seed: 0
max_val_attempts: 50
simulation_tag: synthetic-ui-calibration

# Whole-root target and switches
summary_statistics: [total_length]
distance_metrics: [mean_absolute_error]
stat_by_soil_layer: false
stat_by_soil_column: false
use_summary_statistics: true

# Optimisation
n_trials: 5
n_startup_trials: 2
n_ei_candidates: 24
n_jobs: 1

# Sensitivity analysis
n_samples: 4

# ABC
minimum_epsilon: 0.1
max_nr_populations: 1
start_nr_particles: 4
max_walltime: 2
max_total_nr_simulations: 80

# Shared training settings. For the SNPE exercise set n_simulations to 64.
lr: 0.01
n_epochs: 5
n_simulations: 16

# SNPE
pp_samples: 10
nn_num_hidden_features: 5
nn_num_transforms: 2
sbc_draws: 10

# Surrogate
include_parameters: [min_primary_length, max_primary_length]
exclude_parameters: []
early_stopping_patience: 5
num_inducing_points: 8
n_validation_simulations: 4
n_holdout_simulations: 4
input_columns: []
output_columns: []
